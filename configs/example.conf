# example.conf
# =============================
# Universal Backup Manager - Configuration Template
# Author: PlayWit Creations
# Description:
#   This configuration file defines the source folder to backup,
#   the incremental backup folder, and the compressed archive folder.
#   Copy this file and edit paths to create new backup tasks.
# =============================

# -----------------------------
# SOURCE folder: The folder you want to backup.
# Must exist. Example: your Obsidian vault, Documents, Pictures, etc.
# -----------------------------
SOURCE="/path/to/your/source/folder"

# -----------------------------
# BACKUP_FOLDER: Folder where incremental rsync backups will go.
# The script will create this folder if it does not exist.
# -----------------------------
BACKUP_FOLDER="/path/to/your/incremental/backup/folder"

# -----------------------------
# ARCHIVE_FOLDER: Folder where compressed timestamped archives will be stored.
# The script will create this folder if it does not exist.
# -----------------------------
ARCHIVE_FOLDER="/path/to/your/compressed/archive/folder"